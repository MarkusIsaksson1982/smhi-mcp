[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "smhi-mcp"
version = "0.1.0"
description = "MCP server for SMHI open data: Swedish weather forecasts, warnings and observations (no API key)"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = ["mcp>=2.3,<3"]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
smhi-mcp = "smhi_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/smhi_mcp"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]

[project.urls]
Homepage = "https://github.com/MarkusIsaksson1982/smhi-mcp"
